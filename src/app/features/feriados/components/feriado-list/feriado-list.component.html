@if (feriados.length > 0) {
    <ul class="app-grade">
        @for (feriado of feriados; track feriado.date) {
            <li>
                <app-feriado-item [feriado]="feriado" />
            </li>
        }
    </ul>
} @else {
    <p class="app-vazio">
        <i aria-hidden="true" class="ti ti-calendar-off"></i>
        Nenhum feriado disponível no momento.
    </p>
}
