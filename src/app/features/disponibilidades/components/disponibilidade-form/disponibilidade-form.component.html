<div class="modal-header app-disponibilidade-form__cabecalho">
    <h5 class="modal-title app-disponibilidade-form__titulo">Nova Disponibilidade</h5>
    <button (click)="close()" aria-label="Fechar" class="app-disponibilidade-form__fechar" type="button">
        <i aria-hidden="true" class="ti ti-x"></i>
    </button>
</div>

<form (ngSubmit)="submit()" [formGroup]="form">
    <div class="modal-body app-disponibilidade-form__corpo">
        <div class="app-disponibilidade-form__campo">
            <label class="app-disponibilidade-form__rotulo" for="disponibilidade-dia">Dia da semana</label>
            <select
                [class.app-disponibilidade-form__select--invalido]="isInvalid('diaSemana')"
                class="app-disponibilidade-form__select"
                formControlName="diaSemana"
                id="disponibilidade-dia">
                <option [ngValue]="null">Selecione um dia</option>
                @for (dia of diasDisponiveis; track dia) {
                    <option [ngValue]="dia">{{ dia | enumLabel }}</option>
                }
            </select>
        </div>

        <div class="app-disponibilidade-form__linha">
            <mdb-form-control>
                <input
                    [class.is-invalid]="isInvalid('horaInicio')"
                    class="form-control"
                    formControlName="horaInicio"
                    id="disponibilidade-inicio"
                    mdbInput
                    type="time" />
                <label class="form-label" for="disponibilidade-inicio" mdbLabel>Início</label>
            </mdb-form-control>

            <mdb-form-control>
                <input
                    [class.is-invalid]="isInvalid('horaFim')"
                    class="form-control"
                    formControlName="horaFim"
                    id="disponibilidade-fim"
                    mdbInput
                    type="time" />
                <label class="form-label" for="disponibilidade-fim" mdbLabel>Fim</label>
            </mdb-form-control>
        </div>

        @if (submitted() && form.invalid) {
            <p class="app-disponibilidade-form__erro">
                <i aria-hidden="true" class="ti ti-alert-triangle"></i>
                Preencha todos os campos para cadastrar a disponibilidade.
            </p>
        }
    </div>

    <div class="modal-footer app-disponibilidade-form__rodape">
        <button (click)="close()" class="app-disponibilidade-form__acao" type="button">Cancelar</button>
        <button class="app-disponibilidade-form__acao app-disponibilidade-form__acao--principal" type="submit">
            Cadastrar
        </button>
    </div>
</form>
