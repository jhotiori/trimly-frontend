<div class="modal-header app-agendamento-form__cabecalho">
    <h5 class="modal-title app-agendamento-form__titulo">
        {{ isEditing ? "Editar Agendamento" : "Novo Agendamento" }}
    </h5>
    <button (click)="close()" aria-label="Fechar" class="app-agendamento-form__fechar" type="button">
        <i aria-hidden="true" class="ti ti-x"></i>
    </button>
</div>

<form (ngSubmit)="submit()" [formGroup]="form">
    <div class="modal-body app-agendamento-form__corpo">
        <div class="app-agendamento-form__linha">
            <mdb-form-control>
                <input
                    [attr.max]="dataMaxima"
                    [attr.min]="dataMinima"
                    [class.is-invalid]="isInvalid('data')"
                    class="form-control"
                    formControlName="data"
                    id="agendamento-data"
                    mdbInput
                    type="date" />
                <label class="form-label" for="agendamento-data" mdbLabel>Data</label>
            </mdb-form-control>

            <mdb-form-control>
                <input
                    [class.is-invalid]="isInvalid('horario')"
                    class="form-control"
                    formControlName="horario"
                    id="agendamento-horario"
                    mdbInput
                    type="time" />
                <label class="form-label" for="agendamento-horario" mdbLabel>Horário</label>
            </mdb-form-control>
        </div>

        @if (!isEditing && authStore.isGestor()) {
            <div class="app-agendamento-form__campo">
                <label class="app-agendamento-form__rotulo" for="agendamento-usuario">Cliente</label>
                <select
                    [class.app-agendamento-form__select--invalido]="isInvalid('usuarioId')"
                    class="app-agendamento-form__select"
                    formControlName="usuarioId"
                    id="agendamento-usuario">
                    <option [ngValue]="null">Selecione um cliente</option>
                    @for (cliente of clientes(); track cliente.id) {
                        <option [ngValue]="cliente.id">{{ cliente.nome }}</option>
                    }
                </select>
            </div>
        }

        <div class="app-agendamento-form__campo">
            <label class="app-agendamento-form__rotulo" for="agendamento-servico">Serviço</label>
            <select
                [class.app-agendamento-form__select--invalido]="isInvalid('servicoId')"
                class="app-agendamento-form__select"
                formControlName="servicoId"
                id="agendamento-servico">
                <option [ngValue]="null">Selecione um serviço</option>
                @for (servico of servicos(); track servico.id) {
                    <option [ngValue]="servico.id">{{ servico.nome }}</option>
                }
            </select>
        </div>

        @if (isEditing && authStore.isGestor()) {
            <div class="app-agendamento-form__campo">
                <label class="app-agendamento-form__rotulo" for="agendamento-status">Status</label>
                <select
                    class="app-agendamento-form__select"
                    formControlName="status"
                    id="agendamento-status">
                    @for (status of statusDisponiveis; track status) {
                        <option [ngValue]="status">{{ status | enumLabel }}</option>
                    }
                </select>
            </div>
        }

        @if (submitted() && form.invalid) {
            <p class="app-agendamento-form__erro">
                <i aria-hidden="true" class="ti ti-alert-triangle"></i>
                Preencha todos os campos para agendar.
            </p>
        }
    </div>

    <div class="modal-footer app-agendamento-form__rodape">
        <button (click)="close()" class="app-agendamento-form__acao" type="button">Cancelar</button>
        <button class="app-agendamento-form__acao app-agendamento-form__acao--principal" type="submit">
            {{ isEditing ? "Salvar" : "Agendar" }}
        </button>
    </div>
</form>
