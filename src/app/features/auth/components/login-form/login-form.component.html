<form (ngSubmit)="submit()" [formGroup]="form" class="app-auth__campos">
    <mdb-form-control>
        <input
            [class.is-invalid]="isInvalid('email')"
            autocomplete="email"
            class="form-control"
            formControlName="email"
            id="login-email"
            mdbInput
            type="email" />
        <label class="form-label" for="login-email" mdbLabel>E-mail</label>
    </mdb-form-control>

    <mdb-form-control>
        <input
            [class.is-invalid]="isInvalid('senha')"
            autocomplete="current-password"
            class="form-control"
            formControlName="senha"
            id="login-senha"
            mdbInput
            type="password" />
        <label class="form-label" for="login-senha" mdbLabel>Senha</label>
    </mdb-form-control>

    <button [disabled]="form.invalid" class="app-auth__enviar" type="submit">Entrar</button>
</form>
