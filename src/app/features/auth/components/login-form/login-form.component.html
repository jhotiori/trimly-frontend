<form (ngSubmit)="submit()" [formGroup]="form" class="app-auth__campos">
    <mdb-form-control>
        <input
            [class.is-invalid]="isInvalid('email')"
            autocomplete="email"
            class="form-control"
            formControlName="email"
            id="login-email"
            mdbInput
            type="email" />
        <label class="form-label" for="login-email" mdbLabel>E-mail</label>
        <i aria-hidden="true" class="ti ti-mail app-campo__icone"></i>
    </mdb-form-control>

    <mdb-form-control>
        <input
            [class.is-invalid]="isInvalid('senha')"
            autocomplete="current-password"
            class="form-control"
            formControlName="senha"
            id="login-senha"
            mdbInput
            type="password" />
        <label class="form-label" for="login-senha" mdbLabel>Senha</label>
        <i aria-hidden="true" class="ti ti-lock app-campo__icone"></i>
    </mdb-form-control>

    <button [disabled]="form.invalid" class="app-auth__enviar" type="submit">
        Entrar
    </button>
</form>
