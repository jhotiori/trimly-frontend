<form (ngSubmit)="submit()" [formGroup]="form" class="app-auth__campos">
    <mdb-form-control>
        <input
            [class.is-invalid]="isInvalid('nome')"
            autocomplete="name"
            class="form-control"
            formControlName="nome"
            id="registrar-nome"
            mdbInput
            type="text" />
        <label class="form-label" for="registrar-nome" mdbLabel>Nome</label>
    </mdb-form-control>

    <mdb-form-control>
        <input
            [class.is-invalid]="isInvalid('email')"
            autocomplete="email"
            class="form-control"
            formControlName="email"
            id="registrar-email"
            mdbInput
            type="email" />
        <label class="form-label" for="registrar-email" mdbLabel>E-mail</label>
    </mdb-form-control>

    <mdb-form-control>
        <input
            [class.is-invalid]="isInvalid('senha')"
            autocomplete="new-password"
            class="form-control"
            formControlName="senha"
            id="registrar-senha"
            mdbInput
            type="password" />
        <label class="form-label" for="registrar-senha" mdbLabel>Senha</label>
    </mdb-form-control>

    <button [disabled]="form.invalid" class="app-auth__enviar" type="submit">Registrar</button>
</form>
