<div class="app-dashboard">
    <header class="app-dashboard__cabecalho">
        <h1 class="app-dashboard__saudacao">
            Olá, seja bem-vindo(a) <span class="app-dashboard__usuario">{{ authStore.usuarioAtual()?.nome }}</span>!
            <i aria-hidden="true" class="ti ti-mood-smile app-dashboard__icone"></i>
        </h1>
        <p class="app-dashboard__subtitulo">Aqui está o movimento da sua barbearia hoje.</p>
    </header>

    <div class="app-dashboard__secoes">
        <app-agendamento-list [agendamentos]="agendamentosVisiveis()" />

        @if (authStore.ehGestor()) {
            <app-servico-list [servicos]="servicos()" />
            <app-disponibilidade-list [disponibilidades]="disponibilidades()" />
        }
    </div>
</div>
