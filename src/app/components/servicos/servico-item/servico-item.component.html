<article class="app-servico-item">
    <dl class="app-servico-item__campos">
        <div class="app-servico-item__campo app-servico-item__campo--destaque">
            <dt class="app-servico-item__rotulo">Nome</dt>
            <dd class="app-servico-item__valor">{{ servico.nome }}</dd>
        </div>
        <div class="app-servico-item__campo">
            <dt class="app-servico-item__rotulo">Duração</dt>
            <dd class="app-servico-item__valor">{{ servico.duracao }} min</dd>
        </div>
        <div class="app-servico-item__campo">
            <dt class="app-servico-item__rotulo">Preço</dt>
            <dd class="app-servico-item__valor">{{ formatPreco(servico.valor) }}</dd>
        </div>
    </dl>

    <button
        (click)="editar()"
        aria-label="Editar serviço"
        class="app-servico-item__editar"
        type="button">
        <i aria-hidden="true" class="ti ti-pencil"></i>
    </button>

    <button
        (click)="remove()"
        aria-label="Excluir serviço"
        class="app-servico-item__excluir"
        type="button">
        <i aria-hidden="true" class="ti ti-trash"></i>
    </button>
</article>
